_schema-version: "3.2"
ID: medilink
version: 1.0.0
description: MediLink - SAP Hackfest 2026 prototype (synthetic data). FREE SAP BTP plans only.

# Build:  npm run seed && mbt build -t mta_archives
# Deploy: cf deploy mta_archives/medilink_1.0.0.mtar -e secrets.mtaext
# Secrets are NOT in this file: copy secrets.mtaext.example -> secrets.mtaext (git-ignored) and fill it in.
#
# Free plans used: hana/hdi-shared (on a "hana-free" HANA Cloud instance), xsuaa/application, destination/lite,
# Cloud Foundry runtime free quota. No Integration Suite, no Event Mesh, nothing paid.
# Users open the app router URL (medilink-approuter); it logs them in with XSUAA and forwards to medilink-srv.
# Step-by-step: docs/SAP_GO_LIVE.md

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --prefix backend
        - npm run build --prefix backend
        # offline fixture for the SAP sandbox puller, shipped inside the deployed srv
        - node -e "require('fs').mkdirSync('backend/gen/srv/srv/data',{recursive:true});require('fs').copyFileSync('seed/sap-sandbox-fixture.json','backend/gen/srv/srv/data/sap-sandbox-fixture.json')"
        # the UI (frontend/) is served by the app router
        - node -e "require('fs').cpSync('frontend','app/router/resources',{recursive:true})"

modules:
  # ---------------- CAP service ----------------
  - name: medilink-srv
    type: nodejs
    path: backend/gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
      ignore: ["node_modules/", ".env", "*.env", "aicore-key.json", "default-env.json", ".cdsrc-private.json"]
    properties:
      NODE_ENV: production
      APP_BASE_URL: ${default-url}
      MEDISOFT_OAUTH_REDIRECT_URI: ${default-url}/oauth/medisoft/callback
      TOKEN_STORE: destination
      APPROVAL_MODE: cap          # set to "bpa" once your Build Process Automation process is wired (see README)
      LLM_PROVIDER: none          # set to "aicore" after binding / providing the AI Core key
      JOBS_ENABLED: true
      SYNC_INTERVAL_SEC: 900
      STALE_FEED_MINUTES: 60
      SUPPLIER_RESPONSE_TIMEOUT_MIN: 30
      DEMO_FRESH_SEED: true
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: medilink-db
      - name: medilink-uaa
      - name: medilink-destination
      - name: matcher-api
        properties:
          MATCHER_URL: ~{matcher-url}
      - name: medisoft-api
        properties:
          MEDISOFT_BASE_URL: ~{medisoft-url}

  # ---------------- App router: one URL for users, XSUAA login, serves future UI apps (app/router/resources) ----------------
  - name: medilink-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 128M
      disk-quota: 256M
    build-parameters:
      ignore: ["node_modules/"]
    requires:
      - name: medilink-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api            # referenced by app/router/xs-app.json
          url: ~{srv-url}
          forwardAuthToken: true   # CAP receives the user's XSUAA token (roles + hospital / partner attributes)
          timeout: 60000

  # ---------------- HDI deployer (schema + synthetic seed CSVs) ----------------
  - name: medilink-db-deployer
    type: hdb
    path: backend/gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: medilink-db

  # ---------------- OR-Tools matcher (Python) ----------------
  - name: medilink-matcher
    type: python
    path: matcher
    parameters:
      buildpack: python_buildpack
      memory: 512M
      disk-quota: 1024M
      command: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
      health-check-type: http
      health-check-http-endpoint: /health
    build-parameters:
      builder: custom
      commands: []
      ignore: ["tests/", "__pycache__/", ".pytest_cache/"]
    properties:
      LLM_PROVIDER: none
    provides:
      - name: matcher-api
        properties:
          matcher-url: ${default-url}

  # ---------------- mock "MediSoft HIS" (needed for the live Allow demo) ----------------
  - name: medilink-medisoft
    type: nodejs
    path: mock-medisoft
    parameters:
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
      command: node server.js
    build-parameters:
      builder: npm
      ignore: ["node_modules/", "test/"]
    properties:
      SEED_AUTO_REFRESH: "false"
    provides:
      - name: medisoft-api
        properties:
          medisoft-url: ${default-url}
    requires:
      - name: srv-api
        properties:
          MEDISOFT_ALLOWED_REDIRECTS: ~{srv-url}/oauth/medisoft/callback

resources:
  - name: medilink-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: medilink-db

  - name: medilink-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: medilink-uaa
      path: backend/xs-security.json
      config:
        xsappname: medilink-${org}-${space}
        tenant-mode: dedicated

  - name: medilink-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: medilink-destination
