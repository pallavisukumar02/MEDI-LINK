# MediLink plain-language catalogue (English). Used by srv/lib/messages.js for every /me/* response.
# Translations: copy to messages_kn.properties (Kannada) / messages_hi.properties (Hindi), keep the keys, translate the text.
# {name} placeholders are filled by the backend. No IDs, rule numbers, stack traces or technical terms in any text.

# ---------------------------------------------------------------- errors: onboarding
error.LICENCE_REQUIRED.title=Enter your licence number
error.LICENCE_REQUIRED.message=We need the drug licence number printed on the licence displayed in your pharmacy.
error.LICENCE_REQUIRED.fix=Type the number exactly as printed, for example KA-BLR-20B-1001.
error.LICENCE_UNKNOWN.title=We could not find this licence
error.LICENCE_UNKNOWN.message=Licence {licenceNo} is not in the hospital directory.
error.LICENCE_UNKNOWN.fix=Check the number on your displayed licence. If it is correct, contact MediLink support.
error.LICENCE_EXPIRED.title=Your licence has expired
error.LICENCE_EXPIRED.message=Your drug licence {licenceNo} expired on {validTill}.
error.LICENCE_EXPIRED.fix=Renew it with the Karnataka Drugs Control Department, then try again.
error.FORBIDDEN_HOSPITAL.title=This belongs to another hospital
error.FORBIDDEN_HOSPITAL.message=Your account works for a different hospital than this licence or request.
error.FORBIDDEN_HOSPITAL.fix=Sign in with your own hospital account, or ask your admin to fix your account.
error.NO_HOSPITAL.title=Your account has no hospital
error.NO_HOSPITAL.message=Your account is not linked to a hospital yet.
error.NO_HOSPITAL.fix=Ask your MediLink admin to link your account to your hospital.
error.MEDISOFT_TOKEN_FAILED.title=Your hospital software did not answer
error.MEDISOFT_TOKEN_FAILED.message=We could not finish connecting to your hospital software.
error.MEDISOFT_TOKEN_FAILED.fix=Tap Allow again. If it keeps failing, ask your IT team to check the software is online.
error.PAIRING_CODE_REQUIRED.title=Pairing code missing
error.PAIRING_CODE_REQUIRED.message=The connector needs the one-time pairing code from onboarding.
error.PAIRING_CODE_REQUIRED.fix=Ask the pharmacist for the code shown after entering the licence number.
error.PAIRING_CODE_INVALID.title=Pairing code not valid
error.PAIRING_CODE_INVALID.message=This pairing code is unknown, already used, or older than 24 hours.
error.PAIRING_CODE_INVALID.fix=Enter your licence number again in MediLink to get a fresh code.
error.PAIR_FAILED.title=Pairing did not finish
error.PAIR_FAILED.message=Something went wrong while pairing the connector.
error.PAIR_FAILED.fix=Wait a minute and try again.
error.CONNECTOR_TOKEN_REQUIRED.title=Connector not paired
error.CONNECTOR_TOKEN_REQUIRED.message=The connector tried to send stock without being paired.
error.CONNECTOR_TOKEN_REQUIRED.fix=Pair it once with the code from onboarding.
error.CONNECTOR_TOKEN_INVALID.title=Connector access was removed
error.CONNECTOR_TOKEN_INVALID.message=The connector's access has been revoked or is not valid.
error.CONNECTOR_TOKEN_INVALID.fix=Enter your licence number again to get a new pairing code for your IT team.

# ---------------------------------------------------------------- errors: stock feeds and uploads
error.SHEET_COLUMNS_UNMAPPED.title=We could not read some columns
error.SHEET_COLUMNS_UNMAPPED.message=Your sheet is missing columns we need (medicine, strength, batch, quantity, expiry).
error.SHEET_COLUMNS_UNMAPPED.fix=Add those columns, or ask your admin to confirm which column is which.
error.PATIENT_REF_NOT_HASHED.title=Patient details were not protected
error.PATIENT_REF_NOT_HASHED.message=Some bookings arrived with readable patient numbers, so nothing was saved.
error.PATIENT_REF_NOT_HASHED.fix=Your IT team must send only the protected (hashed) patient reference.
error.HOSPITAL_UNKNOWN.title=Hospital not found
error.HOSPITAL_UNKNOWN.message=This hospital is not in the MediLink directory.
error.HOSPITAL_UNKNOWN.fix=Contact MediLink support.
error.INGEST_FAILED.title=Stock update failed
error.INGEST_FAILED.message=We could not save the latest stock from your system.
error.INGEST_FAILED.fix=It will retry automatically. If it keeps failing, contact your IT team.
error.STALE_FEED.title=Stock is out of date
error.STALE_FEED.message=We have not heard from this hospital's system for over an hour.
error.STALE_FEED.fix=Its stock is set aside until the feed comes back. Ask its IT team to check the connection.
error.LLM_DISABLED.title=Reading documents is switched off
error.LLM_DISABLED.message=Reading photos and alert documents needs the AI service, which is not switched on.
error.LLM_DISABLED.fix=Upload your stock sheet instead, or ask your admin to switch the AI service on.
error.LLM_UNPARSEABLE.title=We could not read that
error.LLM_UNPARSEABLE.message=The document or photo could not be turned into stock rows.
error.LLM_UNPARSEABLE.fix=Take a clearer, well-lit photo of one register page, or upload a sheet.
error.PHOTO_NOTHING_READABLE.title=No stock rows found
error.PHOTO_NOTHING_READABLE.message=We could not find any rows with a readable batch number in the photo.
error.PHOTO_NOTHING_READABLE.fix=Take a clearer photo where every batch number is visible, or upload a sheet.
error.PREVIEW_NOT_FOUND.title=This preview has expired
error.PREVIEW_NOT_FOUND.message=The photo preview is no longer available or was already saved.
error.PREVIEW_NOT_FOUND.fix=Upload the photo again.
error.IMAGE_REQUIRED.title=Add a photo
error.IMAGE_REQUIRED.message=No photo was attached.
error.IMAGE_REQUIRED.fix=Take a photo of the stock register page and try again.
error.PDF_PARSER_MISSING.title=Cannot read PDF files here
error.PDF_PARSER_MISSING.message=This server cannot read PDF files.
error.PDF_PARSER_MISSING.fix=Paste the alert text instead.
error.EMPTY_ALERT.title=The alert is empty
error.EMPTY_ALERT.message=We could not find any text in the alert.
error.EMPTY_ALERT.fix=Check the file and try again.
error.FLAG_TARGET_REQUIRED.title=Say what to flag
error.FLAG_TARGET_REQUIRED.message=A recall needs a batch number or a manufacturer.
error.FLAG_TARGET_REQUIRED.fix=Enter the batch number from the alert.
error.INVALID_REASON.title=Choose a reason
error.INVALID_REASON.message=The reason must be spurious, not of standard quality, or recall.
error.INVALID_REASON.fix=Pick one of the three reasons.
error.FLAGS_NOT_DELETABLE.title=Alerts cannot be deleted
error.FLAGS_NOT_DELETABLE.message=Drug alerts are kept for safety records.
error.FLAGS_NOT_DELETABLE.fix=Switch the alert off instead.

# ---------------------------------------------------------------- errors: requests and matching
error.UNKNOWN_DRUG.title=Medicine not found
error.UNKNOWN_DRUG.message=We do not know this medicine.
error.UNKNOWN_DRUG.fix=Open the medicine from your cover board and try again.
error.UNKNOWN_DRUG_OR_HOSPITAL.title=Medicine not found
error.UNKNOWN_DRUG_OR_HOSPITAL.message=We could not find this medicine for your hospital.
error.UNKNOWN_DRUG_OR_HOSPITAL.fix=Open the medicine from your cover board and try again.
error.NO_SHORTFALL.title=Nothing to request
error.NO_SHORTFALL.message=Your booked doses of {drug} are already covered.
error.NO_SHORTFALL.fix=No action needed. We will alert you if that changes.
error.INVALID_NEEDED_BY.title=Pick a later date
error.INVALID_NEEDED_BY.message=The needed-by date is in the past.
error.INVALID_NEEDED_BY.fix=Choose today or a later date.
error.REQUEST_NOT_FOUND.title=Request not found
error.REQUEST_NOT_FOUND.message=We could not find this request.
error.REQUEST_NOT_FOUND.fix=Go back to your home screen and open it again.
error.REQUEST_IN_FLIGHT.title=Already on the way
error.REQUEST_IN_FLIGHT.message=The medicine has already been picked up, so this request cannot be cancelled.
error.REQUEST_IN_FLIGHT.fix=Wait for the delivery and check it on arrival.
error.PLAN_ALREADY_CHOSEN.title=Supplier already asked
error.PLAN_ALREADY_CHOSEN.message=This request is already with a supplier.
error.PLAN_ALREADY_CHOSEN.fix=No action needed. Follow it on your home screen.
error.PLAN_NOT_FOUND.title=That option is gone
error.PLAN_NOT_FOUND.message=The supplier option you picked is no longer available.
error.PLAN_NOT_FOUND.fix=Tap "Find a supplier again" to get fresh options.
error.MATCHER_UNAVAILABLE.title=Ranking is busy
error.MATCHER_UNAVAILABLE.message=We could not rank suppliers just now.
error.MATCHER_UNAVAILABLE.fix=Try again in a minute.
error.NO_GENUINE_SURPLUS.title=That would leave your patients short
error.NO_GENUINE_SURPLUS.message=Giving this many would leave your own booked patients without enough stock.
error.NO_GENUINE_SURPLUS.fix=Lower the quantity, or decline the request.
error.FLAGGED_BATCH.title=This batch is on a drug alert
error.FLAGGED_BATCH.message=Batch {batch} is on a spurious, sub-standard or recall alert and can never be moved.
error.FLAGGED_BATCH.fix=Keep it aside. MediLink will look for safe stock elsewhere.
error.FLAGGED_MANUFACTURER.title=This maker is on a drug alert
error.FLAGGED_MANUFACTURER.message=Stock from this manufacturer is on a drug alert and can never be moved.
error.FLAGGED_MANUFACTURER.fix=Keep it aside. MediLink will look for safe stock elsewhere.
error.NOT_SEALED.title=The pack is opened
error.NOT_SEALED.message=Only sealed, unopened packs can be given to another hospital.
error.NOT_SEALED.fix=Use opened packs in your own pharmacy.
error.EXPIRES_TOO_SOON.title=Expires too soon
error.EXPIRES_TOO_SOON.message=This stock would expire before it can safely be used.
error.EXPIRES_TOO_SOON.fix=MediLink will offer stock with a later expiry date.
error.STORAGE_MISMATCH.title=Storage does not match
error.STORAGE_MISMATCH.message=This stock is recorded with the wrong storage temperature for the medicine.
error.STORAGE_MISMATCH.fix=Correct the storage in your pharmacy system.
error.NO_COLD_CHAIN_PARTNER.title=No cold-chain courier
error.NO_COLD_CHAIN_PARTNER.message=No courier certified to keep this medicine cold is available.
error.NO_COLD_CHAIN_PARTNER.fix=Try again later, or contact MediLink support.
error.SUPPLIER_LICENCE_INVALID.title=Supplier licence not valid
error.SUPPLIER_LICENCE_INVALID.message=The supplying hospital's drug licence is not valid, so it cannot send stock.
error.SUPPLIER_LICENCE_INVALID.fix=MediLink will ask a licensed hospital instead.
error.RECEIVER_LICENCE_INVALID.title=Your licence is not valid
error.RECEIVER_LICENCE_INVALID.message=Your drug licence is not valid, so you cannot receive stock.
error.RECEIVER_LICENCE_INVALID.fix=Renew it with the Karnataka Drugs Control Department.
error.NO_LICENSED_PARTNER.title=No licensed courier
error.NO_LICENSED_PARTNER.message=No licensed courier is available for this medicine right now.
error.NO_LICENSED_PARTNER.fix=Try again later, or contact MediLink support.
error.DIFFERENT_MEDICINE.title=Not the same medicine
error.DIFFERENT_MEDICINE.message=This stock is a different strength or form.
error.DIFFERENT_MEDICINE.fix=MediLink only offers the exact same medicine.
error.BRAND_SWITCH_NOT_ALLOWED.title=Different brand
error.BRAND_SWITCH_NOT_ALLOWED.message=This stock is another brand, and your request asked for the same brand.
error.BRAND_SWITCH_NOT_ALLOWED.fix=Allow another brand of the same medicine to see more suppliers.
error.ROUTE_CLOSED.title=Road closed
error.ROUTE_CLOSED.message=There is no open road to this hospital right now.
error.ROUTE_CLOSED.fix=MediLink re-checks the roads and will re-route when possible.
error.ETA_AFTER_NEEDED_BY.title=Would arrive too late
error.ETA_AFTER_NEEDED_BY.message=The delivery would arrive after you need it.
error.ETA_AFTER_NEEDED_BY.fix=MediLink will look for a nearer supplier.

# ---------------------------------------------------------------- errors: supplier, approval, delivery, receipt
error.TRANSFER_NOT_FOUND.title=Delivery not found
error.TRANSFER_NOT_FOUND.message=We could not find this delivery.
error.TRANSFER_NOT_FOUND.fix=Go back to your home screen and open it again.
error.INVALID_STATUS.title=Already handled
error.INVALID_STATUS.message=This step has already been done or is no longer needed.
error.INVALID_STATUS.fix=Refresh your home screen to see the latest state.
error.NOT_SUPPLIER.title=Not your request
error.NOT_SUPPLIER.message=Only the supplying hospital can answer this request.
error.NOT_SUPPLIER.fix=No action needed from you.
error.NOT_APPROVER.title=Not yours to sign
error.NOT_APPROVER.message=Sign-off comes from an approver at the supplying hospital.
error.NOT_APPROVER.fix=No action needed from you.
error.NOT_RECEIVER.title=Not your delivery
error.NOT_RECEIVER.message=Only the receiving hospital can check in this delivery.
error.NOT_RECEIVER.fix=No action needed from you.
error.NOT_A_PARTY.title=Not your delivery
error.NOT_A_PARTY.message=Only the two hospitals and the courier on this delivery can do this.
error.NOT_A_PARTY.fix=No action needed from you.
error.WRONG_PARTNER.title=Assigned to another courier
error.WRONG_PARTNER.message=This delivery is assigned to a different courier.
error.WRONG_PARTNER.fix=Check the delivery list in your app.
error.REPAYMENT_MODE_REQUIRED.title=Choose how to be repaid
error.REPAYMENT_MODE_REQUIRED.message=Pick whether you want the same medicine back later or the landed cost.
error.REPAYMENT_MODE_REQUIRED.fix=Choose one option and tap Accept again.
error.INVALID_QUANTITY.title=Check the quantity
error.INVALID_QUANTITY.message=The quantity must be between 1 and {max}.
error.INVALID_QUANTITY.fix=Enter a number in that range.
error.DECLINE_REASON_REQUIRED.title=Tell us why
error.DECLINE_REASON_REQUIRED.message=A short reason helps MediLink ask the right hospital next.
error.DECLINE_REASON_REQUIRED.fix=Pick a reason and tap Decline again.
error.REJECT_REASON_REQUIRED.title=Tell us why
error.REJECT_REASON_REQUIRED.message=A reason is needed so both hospitals know what happened.
error.REJECT_REASON_REQUIRED.fix=Type a short reason and tap Reject again.
error.SECOND_SIGNOFF_SAME_USER.title=A second person must sign
error.SECOND_SIGNOFF_SAME_USER.message=You already gave the first sign-off. This delivery needs a second approver.
error.SECOND_SIGNOFF_SAME_USER.fix=Ask another approver at your hospital to sign.
error.INVALID_DECISION.title=Choose an option
error.INVALID_DECISION.message=That choice is not one of the options.
error.INVALID_DECISION.fix=Tap one of the buttons shown.
error.SCAN_INCOMPLETE.title=Scan everything
error.SCAN_INCOMPLETE.message=Batch, seal and temperature logger all need to be scanned.
error.SCAN_INCOMPLETE.fix=Scan the missing labels and try again.
error.BATCH_MISMATCH.title=Wrong batch
error.BATCH_MISMATCH.message=The scanned batch does not match this delivery.
error.BATCH_MISMATCH.fix=Check you have the right boxes and scan every batch label.
error.STOCK_CHANGED.title=Stock changed
error.STOCK_CHANGED.message=The supplier no longer has enough of this batch on the shelf.
error.STOCK_CHANGED.fix=Ask the supplying pharmacist to check, then try again.
error.SHIPMENT_NOT_FOUND.title=No active delivery
error.SHIPMENT_NOT_FOUND.message=There is no delivery on the road for this logger.
error.SHIPMENT_NOT_FOUND.fix=Check the logger was scanned at pickup.
error.INVALID_TELEMETRY.title=Bad reading
error.INVALID_TELEMETRY.message=The logger sent a reading we could not understand.
error.INVALID_TELEMETRY.fix=Check the logger is working.
error.PROOF_OF_CONDITION_FAILED.title=Cannot accept into stock
error.PROOF_OF_CONDITION_FAILED.message=The checks did not pass (seal, batch, temperature or a complete temperature record).
error.PROOF_OF_CONDITION_FAILED.fix=Set it aside (quarantine) and ask the supplier and courier what happened.
error.NO_PARTNER.title=No courier available
error.NO_PARTNER.message=No licensed courier can carry this medicine right now.
error.NO_PARTNER.fix=MediLink keeps trying. Contact support if this lasts.

# ---------------------------------------------------------------- errors: ledger, settings, admin
error.LOAN_NOT_FOUND.title=Loan not found
error.LOAN_NOT_FOUND.message=We could not find this loan.
error.LOAN_NOT_FOUND.fix=Refresh your home screen.
error.LOAN_NOT_OPEN.title=Loan already closed
error.LOAN_NOT_OPEN.message=This loan has already been repaid or cancelled.
error.LOAN_NOT_OPEN.fix=No action needed.
error.INVALID_MODE.title=Choose how to repay
error.INVALID_MODE.message=Repay with the same medicine, or mark the landed cost as paid.
error.INVALID_MODE.fix=Pick one option.
error.SETTLEMENT_TRANSFER_REQUIRED.title=Pick the return delivery
error.SETTLEMENT_TRANSFER_REQUIRED.message=Repaying in kind needs the delivery that brought the medicine back.
error.SETTLEMENT_TRANSFER_REQUIRED.fix=Choose that delivery from the list.
error.REPAYMENT_NOT_DELIVERED.title=Return not delivered yet
error.REPAYMENT_NOT_DELIVERED.message=The return delivery has not been checked in yet.
error.REPAYMENT_NOT_DELIVERED.fix=Wait until it is accepted at the lending hospital.
error.REPAYMENT_WRONG_PARTIES.title=Wrong delivery
error.REPAYMENT_WRONG_PARTIES.message=The return must go from the borrowing hospital to the lending hospital.
error.REPAYMENT_WRONG_PARTIES.fix=Pick the right delivery.
error.REPAYMENT_WRONG_DRUG.title=Wrong medicine
error.REPAYMENT_WRONG_DRUG.message=The return must be the same medicine that was lent.
error.REPAYMENT_WRONG_DRUG.fix=Pick the right delivery.
error.REPAYMENT_SHORT.title=Not enough returned
error.REPAYMENT_SHORT.message=The return delivery holds fewer vials than were lent.
error.REPAYMENT_SHORT.fix=Send the rest, or mark the difference as paid.
error.PAYMENT_REFERENCE_REQUIRED.title=Add the payment reference
error.PAYMENT_REFERENCE_REQUIRED.message=Marking a loan as paid needs the payment reference.
error.PAYMENT_REFERENCE_REQUIRED.fix=Type the reference from your payment.
error.INVALID_MARGIN.title=Check the safety margin
error.INVALID_MARGIN.message=The safety margin must be between 0 and 100 percent.
error.INVALID_MARGIN.fix=Enter a number from 0 to 100.
error.AUDIT_APPEND_ONLY.title=Records cannot be changed
error.AUDIT_APPEND_ONLY.message=The audit record is permanent and cannot be edited.
error.AUDIT_APPEND_ONLY.fix=No action possible.

# ---------------------------------------------------------------- errors: experience layer
error.UNKNOWN_ACTION.title=Unknown action
error.UNKNOWN_ACTION.message=This button is not recognised.
error.UNKNOWN_ACTION.fix=Refresh the app and try again.
error.INVALID_INPUT.title=Check what you entered
error.INVALID_INPUT.message={detail}
error.INVALID_INPUT.fix=Correct the highlighted field and try again.
error.ACTION_IN_PROGRESS.title=Still working on it
error.ACTION_IN_PROGRESS.message=Your earlier tap is still being processed.
error.ACTION_IN_PROGRESS.fix=Wait a moment, then refresh.
error.NOT_ALLOWED.title=Not available for your role
error.NOT_ALLOWED.message=Your account cannot do this.
error.NOT_ALLOWED.fix=Ask your MediLink admin if you think you should.
error.NOT_SIGNED_IN.title=Please sign in
error.NOT_SIGNED_IN.message=You are not signed in.
error.NOT_SIGNED_IN.fix=Sign in and try again.
error.NOT_FOUND.title=Not found
error.NOT_FOUND.message=We could not find what you asked for.
error.NOT_FOUND.fix=Go back to your home screen.
error.NOTHING_TO_REQUEST.title=Already requested
error.NOTHING_TO_REQUEST.message=There is already an active request for this medicine.
error.NOTHING_TO_REQUEST.fix=Follow it on your home screen.
error.UNEXPECTED.title=Something went wrong
error.UNEXPECTED.message=We could not finish this just now.
error.UNEXPECTED.fix=Try again in a minute. If it keeps happening, contact MediLink support.

