journey.done.supplier=Loan of {qty} vials open: repay in kind or at cost
journey.done.supplier_settled=Loan of {qty} vials repaid
journey.quarantined.receiver=Set aside (quarantined). Don't use until checked
journey.quarantined.supplier=Set aside at {other} for checks
journey.recalled.receiver=This batch was recalled. Transfer cancelled
journey.recalled.supplier=This batch was recalled. Transfer cancelled
journey.cancelled.receiver=You cancelled this request
journey.cancelled.supplier={other} no longer needs it
journey.declined.supplier=You said no
journey.timed_out.supplier=No answer in time, so another hospital was asked
journey.rejected.supplier=Sign-off refused: {reason}
journey.previous.declined={other} said no
journey.previous.timed_out={other} didn't answer in time
journey.previous.rejected=Sign-off refused at {other} ({reason})
journey.temp={value} °C
journey.loan.lender=You lent {qty} vials to {other}
journey.loan.borrower=You owe {other} {qty} vials (or ₹{amount})

