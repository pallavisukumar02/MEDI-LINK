journey.on_the_way.supplier=Picked up
journey.rerouted.receiver=Re-routed around {closure}, new ETA {eta}
journey.rerouted.supplier=Picked up. Re-routed around {closure}
journey.road_blocked.receiver=Road closed. The courier will wait at a safe place
journey.road_blocked.supplier=Road closed. The courier will wait at a safe place
