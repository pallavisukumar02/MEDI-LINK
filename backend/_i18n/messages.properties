journey.waiting_supplier_fallback.receiver={previous}. Asking the next nearest hospital: {other}
journey.waiting_approval.receiver=Supplier said yes, waiting for sign-off
journey.waiting_approval.supplier=Waiting for sign-off
journey.waiting_second_approval.receiver=Supplier said yes, waiting for a second sign-off
journey.waiting_second_approval.supplier=Waiting for a second sign-off
journey.finding_partner.receiver=Approved. Finding a licensed courier
journey.finding_partner.supplier=Approved. Finding a licensed courier
journey.waiting_pickup.receiver=Approved. {partner} will pick it up soon
journey.waiting_pickup.supplier=Approved. {partner} is coming to pick up {qty} vials
