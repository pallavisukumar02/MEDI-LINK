<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediLink</title>
<meta name="description" content="MediLink: hospitals lend and borrow critical medicines. Prototype for SAP Hackfest 2026, demo data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26140D; --body:#6B4333; --btn:#3B2218; --on-btn:#F2F3F5; --hair:rgba(38,20,13,0.08); --hair-strong:rgba(38,20,13,0.16);
  --rose:#F4A7B9; --coral:#F7B89A; --sun:#F5D77E; --mint:#A9DFC1; --sky:#9CCBF0; --indigo:#A9B4F2; --violet:#CDAAF0; --err:#8A2D45;
  --f-head:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --glass-shadow:0 0 0 1px rgba(38,20,13,0.06), 0 12px 32px rgba(38,20,13,0.10), 0 2px 6px rgba(38,20,13,0.06), inset 0 1px 0 rgba(255,255,255,0.95);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#FFFFFF;color:var(--body);font:13px/1.55 var(--f-mono);-webkit-font-smoothing:antialiased;overflow-x:clip}
body.route-stage{min-height:100svh;display:grid;place-items:center;padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f-head);font-weight:700;color:var(--ink);margin:0;letter-spacing:-0.01em}
a{color:var(--ink)}
:focus-visible{outline:3px solid #26140D;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--btn);color:var(--on-btn);padding:10px 16px;border-radius:999px;z-index:50;text-decoration:none}
.skip:focus{top:12px}

/* colour orbs for the glass to refract (fixed, behind everything) */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.2;z-index:-1;pointer-events:none}
.orb.o1{width:420px;height:420px;background:var(--rose);left:calc(50% - 470px);top:12%}
.orb.o2{width:340px;height:340px;background:var(--sky);left:calc(50% + 120px);top:48%}
.orb.o3{width:280px;height:280px;background:var(--mint);left:calc(50% - 160px);top:72%}

/* glass */
.glass{background:rgba(255,255,255,0.58);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,0.9);box-shadow:var(--glass-shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,0.92)}}

/* buttons, links, fields */
.btn{appearance:none;border:0;cursor:pointer;font:700 16px/1 var(--f-mono);height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:var(--on-btn);box-shadow:0 6px 14px rgba(59,34,24,0.25);transition:transform .15s ease, box-shadow .15s ease;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(59,34,24,0.28)}
.btn:active{transform:translateY(0);box-shadow:0 3px 8px rgba(59,34,24,0.25)}
.btn[disabled],.btn[aria-busy="true"]{opacity:.7;cursor:progress;transform:none}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,0.7);color:var(--ink);box-shadow:0 0 0 1px var(--hair-strong), 0 4px 10px rgba(38,20,13,0.06);font-size:14px;height:42px;padding:0 18px}
.btn.small{height:38px;font-size:14px;padding:0 16px}
.btn svg{width:18px;height:18px;flex:none}
.link{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tag{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--hair-strong);border-radius:999px;padding:6px 10px;white-space:nowrap}
.label{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 7px}
.control{position:relative}
.control > svg.lead{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--body);pointer-events:none}
.input{width:100%;height:46px;border-radius:14px;border:1px solid var(--hair-strong);background:rgba(255,255,255,0.7);box-shadow:inset 0 2px 5px rgba(38,20,13,0.07);font:14px var(--f-mono);color:var(--ink);padding:0 14px}
.control .input{padding-left:42px}
.input::placeholder{color:#8a6e62}
.input[aria-invalid="true"]{border-color:var(--err)}
textarea.input{height:auto;min-height:84px;padding:10px 14px;resize:vertical}
select.input{appearance:auto}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--body);cursor:pointer;display:grid;place-items:center}
.eye svg{width:18px;height:18px}
.ferr{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:12px;margin-top:6px}
.ferr svg{width:15px;height:15px;flex:none;margin-top:1px}
.ferr[hidden]{display:none}
.icon{width:18px;height:18px;flex:none}

/* error card (title / message / fix, never the code) */
.errbox{border-radius:16px;padding:12px 14px;background:rgba(244,167,185,0.18);box-shadow:0 0 0 1px rgba(138,45,69,0.22);color:var(--ink);display:grid;gap:4px}
.errbox .t{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--err)}
.errbox .t svg{width:16px;height:16px}
.errbox p{margin:0}
.errbox .fix{color:var(--body)}
.errbox .btn{justify-self:start;margin-top:6px}

/* ================= THE BOTTLE (login + onboarding) ================= */
.stage{position:relative;display:grid;justify-items:center;gap:16px;width:min(460px, 92vw)}
.cap{width:54%;height:auto;display:block;margin-bottom:-16px;position:relative;z-index:3;transform-origin:50% 100%}
.neck{width:44%;height:18px;margin-bottom:-18px;border-radius:6px 6px 0 0;background:rgba(255,255,255,0.5);box-shadow:0 0 0 1px rgba(38,20,13,0.08);position:relative;z-index:2}
.bottle{position:relative;width:100%;min-height:min(740px, calc(100svh - 190px));display:flex;flex-direction:column;border-radius:72px 72px 44px 44px / 60px 60px 44px 44px;
  background:rgba(255,255,255,0.40);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,0.9);
  box-shadow:0 0 0 1px rgba(38,20,13,0.07), 0 34px 44px -24px rgba(38,20,13,0.22), 0 2px 6px rgba(38,20,13,0.06), inset 0 1px 0 rgba(255,255,255,0.95), inset -10px 0 24px -14px rgba(38,20,13,0.10)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottle{background:rgba(255,255,255,0.92)}}
.bottle .gloss{position:absolute;left:14px;top:70px;bottom:70px;width:16px;border-radius:12px;background:rgba(255,255,255,0.6);filter:blur(2px);pointer-events:none;z-index:1}
.bottle-in{position:relative;z-index:2;flex:none;padding:54px 28px 0;display:grid;gap:14px}
.floor{flex:1 0 120px;position:relative;margin-top:24px}
.floor-clip{position:absolute;left:0;right:0;bottom:0;height:min(100%, var(--third, 220px));overflow:hidden;border-radius:0 0 43px 43px;clip-path:inset(0 round 0 0 43px 43px)}
.floor-clip svg,.floor-clip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.floor-clip canvas{pointer-events:none;filter:drop-shadow(0 6px 10px rgba(38,20,13,0.2));opacity:0;transition:opacity .35s ease}
.floor-clip.webgl canvas{opacity:1}
.floor-clip.webgl svg{opacity:0;transition:opacity .35s ease}
.stage-foot{margin:0;font-size:12px;color:var(--body);text-align:center}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-family:var(--f-head);font-weight:700;font-size:21px;color:var(--ink);letter-spacing:-0.02em;text-decoration:none}
.login{display:grid;gap:14px}
#login-error:empty{display:none}
/* short viewports: tighter form so the bottle still fits without scrolling */
@media (max-height: 820px){
  .bottle-in{padding-top:42px}
  .login{gap:9px}
  .login h1{font-size:26px}
  .login .serif{font-size:18px}
  .login .input{height:42px}
  .login .btn.block{height:44px}
  .login .label{margin-bottom:5px}
  .floor{flex-basis:96px}
}
.login h1{font-size:clamp(26px, 6.4vw, 32px);line-height:1.1}
.serif{font-family:var(--f-serif);font-style:italic;font-size:21px;line-height:1.25;color:var(--body);margin:0;max-width:30ch}
.rowlabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rowlabel .label{margin:0 0 7px}
.rowlabel .link{font-size:12px}
.center{text-align:center;margin:0}
.hairline{height:1px;background:var(--hair);border:0;margin:2px 0}
.demorow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px}
.demorow .k{font-weight:500;color:var(--ink)}
.demorow .link[aria-pressed="true"]{text-decoration-thickness:2px;font-weight:500}
.note{font-size:12px;color:var(--body);margin:0}
.fade-up{animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.cap.unscrew{animation:unscrew .7s ease forwards}
@keyframes unscrew{0%{transform:none}30%{transform:translateY(-6px) scaleX(.94)}55%{transform:translateY(-14px) scaleX(1.02) rotate(-4deg)}100%{transform:translateY(-46px) rotate(-14deg);opacity:0}}
.stage.leaving{transition:opacity .45s ease .35s;opacity:0}

/* onboarding checklist inside the bottle */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:16px}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-mono);box-shadow:0 0 0 1px var(--hair-strong);background:rgba(255,255,255,0.7);color:var(--ink)}
.step .dot svg{width:15px;height:15px}
.step b{display:block;color:var(--ink);font-weight:500}
.step span{font-size:12px}
.step.done .dot{background:var(--mint);box-shadow:none}
.step.current{background:rgba(255,255,255,0.75);box-shadow:var(--glass-shadow)}
.step.current .dot{background:var(--btn);color:var(--on-btn);box-shadow:none}
.step.blocked .dot{background:var(--rose);box-shadow:none;color:var(--err)}
.fallbacks{display:flex;flex-wrap:wrap;gap:8px}
.code{font:500 22px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink);background:rgba(255,255,255,0.8);border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1px var(--hair-strong);text-align:center}

/* ================= SIGNED-IN APP ================= */
.topbar{position:sticky;top:10px;z-index:20;margin:10px auto 0;width:min(1180px, calc(100% - 24px));border-radius:999px;display:flex;align-items:center;gap:16px;padding:8px 10px 8px 20px}
.topbar .who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.topbar .who b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:4px;align-items:center}
.topnav a{text-decoration:none;color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:500}
.topnav a[aria-current="page"]{background:rgba(255,255,255,0.9);box-shadow:0 0 0 1px var(--hair-strong)}
.page{width:min(1180px, calc(100% - 32px));margin:28px auto 64px;display:grid;gap:28px}
.hello{display:grid;gap:8px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--body);margin:0}
.hello h1{font-size:clamp(26px, 4vw, 40px);line-height:1.1}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-h h2{font-size:18px}
.section-h .note{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.cards{display:grid;gap:14px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:16px}
.card{border-radius:24px;padding:18px 20px;display:grid;gap:10px}
.card h3{font-size:15px;line-height:1.35}
.card p{margin:0}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.empty{border-radius:24px;padding:18px 20px;color:var(--body)}
.muted{font-size:12px;color:var(--body)}

/* status: colour AND a word, never colour alone */
.status{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:5px 10px 5px 6px;border-radius:999px;background:rgba(255,255,255,0.75);box-shadow:0 0 0 1px var(--hair)}
.status i{width:16px;height:9px;border-radius:999px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(38,20,13,0.12)}
.s-red i{background:var(--rose)} .s-amber i{background:var(--sun)} .s-green i{background:var(--mint)} .s-grey i{background:#E3DEDB}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:18px;padding:12px 14px}
.alert p{margin:0;color:var(--ink)}

/* cover summary as three tablets */
.tablets{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tablet{display:flex;align-items:center;gap:12px;border-radius:999px;padding:8px 18px 8px 8px}
.tablet .pill{width:58px;height:30px;border-radius:999px;display:grid;place-items:center;font:700 15px var(--f-head);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(38,20,13,0.08), 0 2px 4px rgba(38,20,13,0.12)}
.tablet b{display:block;color:var(--ink);font-weight:500}
.tablet span{font-size:12px}

/* journey progress: seven capsules */
.prog{display:grid;grid-template-columns:repeat(7, 1fr);gap:5px}
.prog i{height:10px;border-radius:999px;background:rgba(38,20,13,0.07)}
.prog i.on{background:var(--btn)}
.prog i.now{background:var(--btn);box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--btn)}
.prog.big i{height:14px}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stagelabel{font-size:12px;color:var(--body)}
.headline{font-family:var(--f-serif);font-style:italic;font-size:21px;line-height:1.25;color:var(--ink);margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px}
.facts span{display:inline-flex;gap:6px;align-items:center}
.facts svg{width:14px;height:14px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:96px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.timeline time{font-size:12px;color:var(--body);text-align:right}
.timeline .tdot{width:10px;height:10px;border-radius:50%;background:var(--btn);margin-top:4px;position:relative}
.timeline li:not(:last-child) .tdot::after{content:"";position:absolute;left:4px;top:12px;width:2px;height:calc(100% + 14px);background:var(--hair-strong)}
.timeline p{margin:0;color:var(--ink)}
.notebox{border-radius:16px;padding:12px 14px;background:rgba(255,255,255,0.7);box-shadow:0 0 0 1px var(--hair);color:var(--ink)}
.stagenames{display:grid;grid-template-columns:repeat(7, 1fr);gap:5px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--body);margin-top:6px}
.stagenames span{text-align:center}
.stagenames span.now{color:var(--ink);font-weight:500}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-radius:18px;padding:12px 16px}
.row b{color:var(--ink);font-weight:500}
.metric{border-radius:20px;padding:16px 18px;display:grid;gap:6px}
.metric .v{font:700 24px var(--f-head);color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:14px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:500}
.back svg{width:16px;height:16px}

/* dialog for action forms */
dialog.dlg{border:0;padding:0;border-radius:28px;width:min(520px, calc(100% - 24px));color:var(--body);background:rgba(255,255,255,0.86);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--glass-shadow)}
dialog.dlg::backdrop{background:rgba(38,20,13,0.18)}
.dlg form{padding:22px 22px 20px;display:grid;gap:14px}
.dlg h2{font-size:19px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,0.7);box-shadow:0 0 0 1px var(--hair);cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--btn)}
.opt b{color:var(--ink);font-weight:500;display:block}
.opt small{display:block;font-size:12px}
.yesno{display:flex;gap:8px}
.yesno label{flex:1}
.preview{max-height:180px;overflow:auto;border-radius:12px;box-shadow:0 0 0 1px var(--hair);font-size:12px}
.preview table{width:100%;border-collapse:collapse}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:left;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;border-radius:999px;padding:12px 20px;color:var(--ink);max-width:calc(100% - 32px);font-weight:500}
.toast[hidden]{display:none}

@media (max-width: 900px){
  .grid2{grid-template-columns:1fr}
  .topbar{border-radius:24px;flex-wrap:wrap;padding:10px 12px}
  .topnav{order:3;width:100%;overflow-x:auto}
}
@media (max-width: 520px){
  .timeline li{grid-template-columns:70px 14px 1fr}
  .jgrid{grid-template-columns:1fr}
  .orb.o1{left:-140px} .orb.o2{left:auto;right:-120px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body class="route-stage">
<a class="skip" href="#view">Skip to content</a>
<div class="orb o1" aria-hidden="true"></div><div class="orb o2" aria-hidden="true"></div><div class="orb o3" aria-hidden="true"></div>
<div id="view"></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* MediLink app: #/login (mock auth) and the signed-in screens on the experience API (/me/*, docs/EXPERIENCE_API.md).
   Prototype, synthetic data only. Session lives in memory only (no localStorage). */

// ---------------------------------------------------------------- icons (Lucide, inline)
const LUCIDE = {
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
  arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',

async function api(method, path, body, headers = {}) {
  let res;

    res = await fetch(path, {
      method, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', ...(session.authorization ? { Authorization: session.authorization } : {}), ...headers },

// ================================================================= THE TABLET PILE (inside the bottle)
const PILL_COLOURS = ['#F4A7B9', '#F7B89A', '#F5D77E', '#A9DFC1', '#9CCBF0', '#A9B4F2', '#CDAAF0'];

function pileLayout() {
  const r = rng(7031), kinds = ['round', 'oval', 'capsule', 'half'];
  const pieces = [];
  // colours cycle so every tint shows up; shapes and rotations stay random
  const add = (x, layer, lean) => { const n = pieces.length; pieces.push({ x, layer, lean, kind: kinds[Math.floor(r() * kinds.length)], c1: PILL_COLOURS[(n * 3) % 7], c2: PILL_COLOURS[(n * 3 + 2) % 7], rot: r() * Math.PI * 2, tilt: 0.6 + r() * 0.8, seed: r() }); };
  for (let i = 0; i < 7; i++) add(-3.9 + i * 1.3 + (r() - 0.5) * 0.4, 0, 0);                     // base layer, wall to wall
  for (let i = 0; i < 5; i++) add(-2.9 + i * 1.45 + (r() - 0.5) * 0.4, 1, 0);                   // second layer
  add(-0.9 + r() * 0.4, 2, 0); add(0.6 + r() * 0.4, 2, 0);                                        // top of the mound (deeper middle)
  add(-4.45, 1, -1); add(-4.2, 2, -1); add(4.45, 1, 1); add(4.25, 2, 1);                          // leaning on the walls
  return pieces;
}

/** Flat SVG version of the same pile (shown while loading, and if WebGL is unavailable). */
function pileSvg(w, h) {
  const unit = w / 10, floorY = h - 6, L = pileLayout();
  const layerY = [0, 0.42, 0.8];
  const shape = (p, i) => {
    const cx = (p.x + 5) * unit, cy = floorY - (layerY[p.layer] + 0.28) * unit - (p.lean ? 0.15 * unit : 0);
    const rot = p.lean ? -p.lean * 62 : (p.rot * 57.3) % 40 - 20;
    const s = unit, stroke = 'rgba(38,20,13,0.18)';
    let g;
    if (p.kind === 'capsule') g = `<g><path d="M${-0.62 * s},0 a${0.24 * s},${0.24 * s} 0 0 1 ${0.24 * s},${-0.24 * s} h${0.38 * s} v${0.48 * s} h${-0.38 * s} a${0.24 * s},${0.24 * s} 0 0 1 ${-0.24 * s},${-0.24 * s}z" fill="${p.c1}" stroke="${stroke}"/><path d="M0,${-0.24 * s} h${0.38 * s} a${0.24 * s},${0.24 * s} 0 0 1 0,${0.48 * s} h${-0.38 * s}z" fill="${p.c2}" stroke="${stroke}"/></g>`;
    else if (p.kind === 'half') g = `<path d="M${-0.6 * s},${0.18 * s} a${0.6 * s},${0.6 * s} 0 0 1 ${1.2 * s},0z" fill="${p.c1}" stroke="${stroke}"/>`;
    else g = `<ellipse rx="${(p.kind === 'oval' ? 0.64 : 0.56) * s}" ry="${0.26 * s}" fill="${p.c1}" stroke="${stroke}"/><ellipse rx="${(p.kind === 'oval' ? 0.5 : 0.42) * s}" ry="${0.12 * s}" cy="${-0.05 * s}" fill="rgba(255,255,255,0.35)"/>`;
    return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${rot.toFixed(1)})">${g}</g>`;
  };
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${L.map(shape).join('')}</svg>`;
}

function mountPile(clip, bottle, { interactive }) {

  let hovered = -1;
  function onMove(e) {
    ptr.nx = (e.clientX / innerWidth) * 2 - 1; ptr.ny = (e.clientY / innerHeight) * 2 - 1; ptr.active = true;
    const r = canvas.getBoundingClientRect();
    ptr.inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 40 && e.clientY <= r.bottom;
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    ray.ray.intersectPlane(plane, ptr.world);
    hovered = -1;
    if (ptr.inside) { const hit = ray.intersectObjects(meshes, true)[0]; if (hit) hovered = hit.object.userData.piece; }
  }
  const onLeave = () => { ptr.inside = false; hovered = -1; };

  // simple physics: spring to rest (k 0.08, damping 0.85), repel near the pointer, clamp to the glass
  const K = 0.08, D = 0.85, R = 1.5;
  let running = false, raf = 0, t0 = performance.now(), visible = true;
  function step(now) {
    const t = (now - t0) / 1000;
    const tx = coarse ? Math.sin(t * 0.5) * 0.08 : ptr.active ? ptr.nx * THREE.MathUtils.degToRad(10) : 0;
    const ty = coarse ? Math.sin(t * 0.37) * 0.04 : ptr.active ? ptr.ny * THREE.MathUtils.degToRad(6) : 0;
    heap.rotation.y += (tx - heap.rotation.y) * 0.06;
    heap.rotation.x += (ty - heap.rotation.x) * 0.06;
    pieces.forEach((q, i) => {
      if (!q.live) { if (t * 1000 >= q.delay) { q.live = true; q.obj.visible = true; } else { q.obj.visible = false; return; } }
      q.vel.x = (q.vel.x + (q.rest.x - q.pos.x) * K) * D;
      q.vel.y = (q.vel.y + (q.rest.y - q.pos.y) * K) * D;
      q.vel.z = (q.vel.z + (q.rest.z - q.pos.z) * K) * D;
      if (ptr.inside && !coarse) {
        const dx = q.pos.x - ptr.world.x, dy = q.pos.y - ptr.world.y, dist = Math.hypot(dx, dy) || 0.001;
        if (dist < R) { const f = (1 - dist / R) * 0.05; q.vel.x += (dx / dist) * f; q.vel.y += Math.abs(dy / dist) * f * 0.6 + f * 0.25; q.spinV += f * 0.4 * (dx > 0 ? 1 : -1); }
      }
      q.pos.add(q.vel);
      const hx = Math.min(q.half.x, 0.7), hy = Math.min(q.half.y, 0.6);
      q.pos.x = Math.max(-W / 2 + hx, Math.min(W / 2 - hx, q.pos.x));
      if (q.pos.y < floorY + hy) { q.pos.y = floorY + hy; q.vel.y = Math.abs(q.vel.y) * 0.35; }
      q.pos.y = Math.min(ceilY - hy, q.pos.y);
      q.spinV *= 0.9; q.spin = (q.spin + q.spinV) * 0.94;
      q.lift += ((hovered === i && !coarse ? 1 : 0) - q.lift) * 0.15;
      q.obj.position.set(q.pos.x, q.pos.y + q.lift * 0.3, q.pos.z);
      q.obj.rotation.set(q.restRot.x, q.restRot.y, q.restRot.z + q.spin + q.lift * 0.26);
      q.obj.scale.setScalar(1 + q.lift * 0.06);
    });
    renderer.render(scene, camera);
    if (running) raf = requestAnimationFrame(step);
  }
  function draw() { if (!running) { pieces.forEach(q => { q.obj.visible = q.live || reduced; q.obj.position.copy(q.pos); }); renderer.render(scene, camera); } }
  function start() { if (running || reduced || !visible || document.hidden) return; running = true; raf = requestAnimationFrame(step); }
  function stop() { running = false; cancelAnimationFrame(raf); }

  resizeFn = resize;
  resize();
  // entry: pieces drop in with a small bounce, staggered (about 900 ms)
  pieces.forEach((q, i) => { q.delay = reduced ? 0 : 40 + i * 28; q.pos.copy(q.rest); if (!reduced) { q.pos.y += 3.2 + (i % 4) * 0.3; q.live = false; } else q.live = true; });
  clip.classList.add('webgl');
  if (reduced) { draw(); } else start();

  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; visible ? start() : stop(); });
  io.observe(clip);
  const onVis = () => (document.hidden ? stop() : start());
  document.addEventListener('visibilitychange', onVis);
  if (interactive && !reduced) { addEventListener('pointermove', onMove, { passive: true }); document.addEventListener('pointerleave', onLeave); }

  const kick = (fx, fy, fs) => pieces.forEach(q => { q.vel.x += (Math.random() - 0.5) * fx; q.vel.y += fy * (0.6 + Math.random() * 0.6); q.spinV += (Math.random() - 0.5) * fs; });
  api.wiggle = () => { if (!reduced) kick(0.08, 0.04, 0.12); };
  api.hop = () => { if (!reduced) kick(0.04, 0.28, 0.2); };
  api.jostle = () => { if (!reduced) kick(0.22, 0.2, 0.4); };
  api.destroy = () => {
    stop(); io.disconnect(); ro.disconnect();
    document.removeEventListener('visibilitychange', onVis);
    removeEventListener('pointermove', onMove); document.removeEventListener('pointerleave', onLeave);
    renderer.dispose(); scene.traverse(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
  };
  return api;
}

const STATUS_WORD = { red: 'Needs attention', amber: 'In progress', green: 'On track', grey: 'Closed' };
const statusChip = (colour, word) => `<span class="status s-${esc(colour)}"><i aria-hidden="true"></i>${esc(word || STATUS_WORD[colour] || colour)}</span>`;
const SEVERITY_WORD = { red: 'Urgent', amber: 'Heads-up' };
let lastHome = null;

function appShell(active, content) {

function poll(fn, ms = 10000) {

  onCleanup(() => clearInterval(id));
}
function viewError(err, active) {

  $('#view-retry')?.addEventListener('click', route);

// ---------------------------------------------------------------- action buttons (rendered from the API's action descriptors)
let actionSeq = 0;
const actionRegistry = new Map();
function actionBtn(a, extraCls = '') {
  if (!a) return '';
  const id = 'act-' + (++actionSeq);
  actionRegistry.set(id, a);
  const cls = a.style === 'secondary' ? 'btn ghost small' : 'btn small';
  return `<button type="button" class="${cls} ${extraCls}" data-act="${id}" ${a.available === false ? `disabled title="${esc(a.unavailableReason || '')}"` : ''}>${esc(a.label)}</button>`;
}
function wireActions(root, after) {
  root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => openAction(actionRegistry.get(b.dataset.act), after)));
}

function fieldHtml(f, i) {
  const id = `f-${i}`, req = f.required ? 'required' : '';
  const hint = f.hint ? `<div class="muted" id="${id}-hint">${esc(f.hint)}</div>` : '';
  const err = `<div class="ferr" id="${id}-err" hidden></div>`;
  const desc = `aria-describedby="${f.hint ? id + '-hint ' : ''}${id}-err"`;
  let control;
  if (f.type === 'boolean') {
    control = `<div class="yesno" role="radiogroup" aria-label="${esc(f.label)}">${[['true', 'Yes'], ['false', 'No']].map(([v, l]) => `<label class="opt"><input type="radio" name="${esc(f.name)}" value="${v}" ${String(f.default ?? '') === v ? 'checked' : ''}><b>${l}</b></label>`).join('')}</div>`;
    return `<fieldset style="border:0;padding:0;margin:0"><legend class="label">${esc(f.label)}</legend>${control}${hint}${err}</fieldset>`;
  }
  if (f.type === 'choice') {
    if ((f.options || []).length <= 5) {
      control = `<div class="opts">${f.options.map(o => `<label class="opt"><input type="radio" name="${esc(f.name)}" value="${esc(o.value)}" ${String(f.default ?? '') === String(o.value) ? 'checked' : ''} ${req}><span><b>${esc(o.label)}</b>${o.reason ? `<small>${esc(o.reason)}</small>` : ''}</span></label>`).join('')}</div>`;
      return `<fieldset style="border:0;padding:0;margin:0"><legend class="label">${esc(f.label)}</legend>${control}${hint}${err}</fieldset>`;
    }
    control = `<select class="input" id="${id}" name="${esc(f.name)}" ${req} ${desc}>${f.options.map(o => `<option value="${esc(o.value)}" ${String(f.default ?? '') === String(o.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if (f.type === 'file') {
    control = `<input class="input" style="padding-top:10px" id="${id}" name="${esc(f.name)}" type="file" accept="${esc(f.accept || '')}" ${req} ${desc}>`;
  } else if (f.type === 'text' && /note|reason/i.test(f.name)) {
    control = `<textarea class="input" id="${id}" name="${esc(f.name)}" ${req} ${desc}>${esc(f.default ?? '')}</textarea>`;
  } else {
    const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    control = `<input class="input" id="${id}" name="${esc(f.name)}" type="${type}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''} value="${esc(f.default ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'barcode' ? 'autocomplete="off" spellcheck="false" style="font-family:var(--f-mono);letter-spacing:.04em"' : ''} ${req} ${desc}>`;
  }
  return `<div><label class="label" for="${id}">${esc(f.label)}</label>${control}${hint}${err}</div>`;
}
const readFile = (file, asText) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(asText ? r.result : String(r.result).replace(/^data:[^;]+;base64,/, '')); r.onerror = rej; asText ? r.readAsText(file) : r.readAsDataURL(file); });

async function collect(form, fields) {
  const values = {}; let ok = true;
  for (const [i, f] of fields.entries()) {
    const errBox = form.querySelector(`#f-${i}-err`);
    let v;
    if (f.type === 'boolean' || (f.type === 'choice' && f.options.length <= 5)) v = form.querySelector(`input[name="${CSS.escape(f.name)}"]:checked`)?.value;
    else if (f.type === 'file') { const file = form.querySelector(`#f-${i}`).files[0]; if (file) { v = await readFile(file, f.name === 'csv'); if (f.name === 'imageBase64') values.mimeType = file.type || 'image/jpeg'; } }
    else v = form.querySelector(`#f-${i}`).value;
    const missing = f.required && (v === undefined || v === '');
    if (errBox) { errBox.hidden = !missing; errBox.innerHTML = missing ? `${icon('alert')}<span>Please fill this in.</span>` : ''; }
    if (missing) { ok = false; continue; }
    if (v === undefined || v === '') continue;
    values[f.name] = f.type === 'boolean' ? v === 'true' : f.type === 'number' || (f.type === 'choice' && typeof f.options[0]?.value === 'number') ? Number(v) : v;
  }
  return ok ? values : null;
}

function previewTable(rows) {
  if (!Array.isArray(rows) || !rows.length) return '';
  const cols = ['generic', 'strength', 'batchNo', 'quantity', 'expiryDate'].filter(c => rows.some(r => r[c] !== undefined));
  return `<div class="preview"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/** Open an action: confirm and/or a small form built from its fields, then POST with an Idempotency-Key. */
function openAction(a, after, extraHtml = '') {
  const dlg = $('#dlg');
  const fields = a.fields || [];
  if (!fields.length && !a.confirm && !extraHtml) return runAction(a, {}, after);
  dlg.innerHTML = `<form method="dialog" id="dlg-form" novalidate>
      <h2 id="dlg-title">${esc(a.label)}</h2>
      ${a.confirm ? `<p style="margin:0;color:var(--ink)">${esc(a.confirm)}</p>` : ''}
      ${extraHtml}
      ${fields.map(fieldHtml).join('')}
      <div id="dlg-error"></div>
      <div class="acts"><button type="button" class="btn ghost small" id="dlg-cancel">Cancel</button><button type="submit" class="btn small" id="dlg-ok">${esc(a.label)}</button></div>
    </form>`;
  dlg.showModal();
  const key = newKey(); // one key per dialog: a double tap or a retry runs the action once
  $('#dlg-cancel').addEventListener('click', () => dlg.close());
  $('#dlg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const values = await collect(e.target, fields);
    if (!values) return;
    const ok = $('#dlg-ok'); ok.disabled = true; ok.setAttribute('aria-busy', 'true'); ok.textContent = 'Working…';
    const done = await runAction(a, values, after, key, err => {
      $('#dlg-error').innerHTML = errorCard(err, 'dlg-retry');
      $('#dlg-retry')?.addEventListener('click', () => $('#dlg-form').requestSubmit());
    });
    if (!done) { ok.disabled = false; ok.removeAttribute('aria-busy'); ok.textContent = a.label; }
  });
  dlg.querySelector('input,select,textarea,button[type=submit]')?.focus();
}
dialogBackdropClose();
function dialogBackdropClose() { $('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); }); }

async function runAction(a, values, after, key = newKey(), onError) {
  try {
    const r = await api(a.method || 'POST', a.path, { ...(a.body || {}), ...values }, { 'Idempotency-Key': key });
    toast(r.message);
    if ($('#dlg').open) $('#dlg').close();
    handleNext(r, after);
    await after?.(r);
    return true;
  } catch (err) {
    if (onError) onError(err);
    else { const dlg = $('#dlg'); dlg.innerHTML = `<form method="dialog"><h2 id="dlg-title">${esc(a.label)}</h2>${errorCard(err, 'dlg-retry2')}<div class="acts"><button class="btn ghost small" value="close">Close</button></div></form>`; dlg.showModal(); $('#dlg-retry2')?.addEventListener('click', () => { dlg.close(); runAction(a, values, after, key); }); }
    return false;
  }
}
function handleNext(r, after) {
  const n = r.next;
  if (!n) return;
  if (n.type === 'open') {
    // opened from a direct click: browsers block popups that start after an await
    const dlg = $('#dlg');
    dlg.innerHTML = `<form method="dialog"><h2 id="dlg-title">${esc(n.label)}</h2>
      <p style="margin:0">Your hospital software opens in a small window. Sign in as you do every day, check what is shared, then tap Allow.</p>
      <div class="acts"><button type="button" class="btn ghost small" value="cancel" id="open-cancel">Not now</button><button type="button" class="btn small" id="open-go">Open sign-in ${icon('arrowRight')}</button></div></form>`;
    dlg.showModal();
    $('#open-cancel').addEventListener('click', () => dlg.close());
    $('#open-go').addEventListener('click', () => {
      const win = window.open(n.url, 'medilink-allow', 'width=480,height=680');
      if (!win) location.href = n.url; // popups disabled entirely: continue in this tab
      dlg.close();
    });
  } else if (n.type === 'show') {
    const dlg = $('#dlg');
    dlg.innerHTML = `<form method="dialog"><h2 id="dlg-title">Send this to your IT team</h2>
      <p style="margin:0">Your IT team installs a small read-only connector and pairs it once with this code. It works for 24 hours.</p>
      <div class="code" aria-label="Pairing code">${esc(n.pairingCode)}</div>
      <p style="margin:0">Setup guide: <a href="${esc(n.setupLink)}" target="_blank" rel="noopener">${esc(n.setupLink)}</a></p>
      <div class="acts"><button class="btn small" value="ok">Done</button></div></form>`;
    dlg.showModal();
  } else if (n.type === 'action') {
    setTimeout(() => openAction(n.action, after, previewTable(r.result?.rows || r.result?.preview)), 50);
  }
}

// ---------------------------------------------------------------- cards
function journeyCard(j, compact) {
  const last = j.timeline?.[j.timeline.length - 1];
  const facts = [
    j.counterpart && `<span>${icon('pin')}${esc(j.perspective === 'supplier' ? 'For ' : 'From ')}${esc(j.counterpart)}</span>`,
    j.eta && `<span>${icon('clock')}ETA ${esc(new Date(j.eta).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }))}</span>`,
    j.temperatureC != null && `<span>${icon('thermo')}${esc(j.temperatureC.toFixed(1))} °C</span>`,
  ].filter(Boolean).join('');
  return `<article class="card glass" aria-label="${esc(j.drug.name)}">
    <div class="jhead">${statusChip(j.colour)}<span class="stagelabel">Stage ${j.stage} of ${j.of} · ${esc(j.stageLabel)}</span></div>
    ${progress(j)}
    <h3>${esc(j.drug.name)}${j.qty ? ` · ${esc(j.qty)} ${j.stage === 1 ? 'doses' : 'vials'}` : ''}</h3>
    <p class="headline">${esc(j.headline)}</p>
    ${facts ? `<div class="facts">${facts}</div>` : ''}
    ${!compact && last ? `<p class="muted">${esc(last.time)} · ${esc(last.text)}</p>` : ''}
    <div class="acts">${(j.actions || []).map(a => actionBtn(a)).join('')}${j.requestId ? `<a class="link" href="#/journey/${encodeURIComponent(j.id)}">Details</a>` : ''}</div>
  </article>`;
}
function progress(j, big) {
  return `<div class="prog ${big ? 'big' : ''}" role="progressbar" aria-valuemin="1" aria-valuemax="${j.of}" aria-valuenow="${j.stage}" aria-valuetext="Stage ${j.stage} of ${j.of}: ${esc(j.stageLabel)}">${Array.from({ length: j.of }, (_, i) => `<i class="${i + 1 < j.stage ? 'on' : i + 1 === j.stage ? 'now' : ''}"></i>`).join('')}</div>`;
}
function taskCard(t) {
  return `<article class="card glass">
    <div class="jhead">${statusChip(t.colour, t.urgency === 'high' ? 'Do now' : t.urgency === 'medium' ? 'Today' : 'When you can')}${t.dueBy ? `<span class="stagelabel">${t.dueBy.length > 10 ? 'By ' + esc(new Date(t.dueBy).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })) : 'Needed by ' + esc(new Date(t.dueBy + 'T12:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }))}</span>` : ''}</div>
    <h3>${esc(t.title)}</h3>
    <p>${esc(t.subtitle)}</p>
    <div class="acts">${actionBtn(t.primaryAction)}${actionBtn(t.secondaryAction)}${t.journeyId && !t.journeyId.startsWith('shortfall:') ? `<a class="link" href="#/journey/${encodeURIComponent(t.journeyId)}">Details</a>` : ''}</div>
  </article>`;
}

// ================================================================= ONBOARDING (checklist inside the bottle)
async function viewOnboarding() {
  document.title = 'Set up · MediLink';
  let ob;
  try { ob = await api('GET', '/me/onboarding'); } catch (err) { return viewError(err, '#/home'); }
  document.body.className = 'route-stage';
  const stepIcon = s => (s.status === 'done' ? icon('check') : s.status === 'blocked' ? icon('alert') : '');
  $('#view').innerHTML = bottleShell(`
    <div class="brandrow"><a class="wordmark" href="#/home">MediLink</a><span class="tag">Setting up</span></div>
    <h1 style="font-size:clamp(24px,6vw,30px);line-height:1.1">${ob.done ? "You're connected" : 'Connect your hospital'}</h1>
    <p class="serif">${esc(ob.message)}</p>
    <ol class="steps">${ob.steps.map((s, i) => `<li class="step ${esc(s.status)}" ${s.status === 'current' ? 'aria-current="step"' : ''}><span class="dot">${stepIcon(s) || i + 1}</span><span><b>${esc(s.label)}<span class="sr-only"> (${esc(s.status)})</span></b><span>${esc(s.detail)}</span></span></li>`).join('')}</ol>
    ${ob.error ? errorCard(ob.error) : ''}
    <div class="acts" style="display:grid;gap:10px">
      ${ob.done ? `<a class="btn block" href="#/home">Go to my board ${icon('arrowRight')}</a>` : ob.nextAction ? actionBtn({ ...ob.nextAction, style: 'primary' }, 'block') : ''}
    </div>
    ${ob.fallbacks?.length ? `<hr class="hairline"><p class="label" style="margin:0">Other ways to connect</p><div class="fallbacks">${ob.fallbacks.map(a => actionBtn({ ...a, style: 'secondary' })).join('')}</div>` : ''}
  `, { label: 'Connect your hospital' });
  $('#view .bottle-in .btn.block')?.classList.remove('small');
  wireActions($('#view'), () => viewOnboarding());
  const pile = mountPile($('#floor-clip'), $('#bottle'), { interactive: false });
  onCleanup(() => pile.destroy());
  // the hospital software's sign-in popup tells us when the Allow step is done
  const onMsg = e => { if (e.data && e.data.medilink === 'connected') { toast('Connected. Your board will be ready in a few minutes.'); viewOnboarding(); } };
  addEventListener('message', onMsg); onCleanup(() => removeEventListener('message', onMsg));
  if (!ob.done) poll(async () => { try { const fresh = await api('GET', '/me/onboarding'); if (fresh.current !== ob.current) viewOnboarding(); } catch { /* ignore */ } }, 4000);
}

// ================================================================= JOURNEY DETAIL
async function viewJourney(id) {
  document.title = 'Journey · MediLink';
  let j;
  try { j = await api('GET', `/me/journeys/${encodeURIComponent(id)}`); } catch (err) { return viewError(err, '#/home'); }
  if (!lastHome) { try { lastHome = await api('GET', '/me/home'); } catch { /* chrome without status */ } }
  const STAGES = ['Shortfall', 'Request', 'Supplier', 'Approval', 'On the way', 'Arrived', 'Done'];
  const facts = [
    ['Medicine', j.drug.name], ['Quantity', j.qty ? `${j.qty} vials` : null], ['Needed by', j.neededBy ? new Date(j.neededBy + 'T12:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : null],
    ['From', j.from], ['To', j.to], ['Arriving', j.eta ? new Date(j.eta).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : null],
    ['Temperature', j.temperatureC != null ? `${j.temperatureC.toFixed(1)} °C` : null],
    ['Loan', j.loan ? `${j.loan.qty} vials · ${j.loan.status === 'OPEN' ? 'open' : 'repaid'} · ${j.loan.mode === 'IN_KIND' ? 'repay in kind' : 'repay at cost'}` : null],
  ].filter(([, v]) => v);
  appShell('#/home', `
    <a class="back" href="#/home">${icon('arrowLeft')}Back to home</a>
    <section class="card glass" style="padding:24px">
      <div class="jhead">${statusChip(j.colour)}<span class="stagelabel">Stage ${j.stage} of ${j.of} · ${esc(j.stageLabel)}</span></div>
      <div>${progress(j, true)}<div class="stagenames" aria-hidden="true">${STAGES.map((s, i) => `<span class="${i + 1 === j.stage ? 'now' : ''}">${s}</span>`).join('')}</div></div>
      <h1 style="font-size:clamp(22px,3vw,30px)">${esc(j.drug.name)}</h1>
      <p class="headline" style="font-size:24px">${esc(j.headline)}</p>
      <div class="facts" style="font-size:13px">${facts.map(([k, v]) => `<span><b style="color:var(--ink);font-weight:500">${esc(k)}:</b> ${esc(v)}</span>`).join('')}</div>
      ${j.note ? `<div class="notebox"><p class="label" style="margin-bottom:4px">Handling note</p>${esc(j.note)}</div>` : ''}
      ${(j.actions || []).length ? `<div class="acts">${j.actions.map(a => actionBtn(a)).join('')}</div>` : ''}
    </section>
    <section class="card glass" aria-labelledby="tl-h"><h2 id="tl-h" style="font-size:17px">What happened</h2>
      ${j.timeline.length ? `<ol class="timeline">${j.timeline.map(e => `<li><time datetime="${esc(e.at)}">${esc(e.time)}</time><span class="tdot" aria-hidden="true"></span><p>${esc(e.text)}</p></li>`).join('')}</ol>` : '<p class="muted">Nothing has happened yet.</p>'}
    </section>`);
  wireActions($('#main'), r => (r?.journey ? viewJourney(r.journey.id) : viewJourney(id)));
  poll(async () => { try { const fresh = await api('GET', `/me/journeys/${encodeURIComponent(id)}`); if (JSON.stringify(fresh) !== JSON.stringify(j)) viewJourney(id); } catch { /* ignore */ } });
}

// ================================================================= CITY
async function viewCity() {
  document.title = 'City view · MediLink';
  let c;
  try { c = await api('GET', '/me/city'); if (!lastHome) lastHome = await api('GET', '/me/home'); } catch (err) { return viewError(err, '#/city'); }
  appShell('#/city', `
    <section class="hello"><p class="eyebrow">Bengaluru · next ${esc(c.windowDays)} days</p><h1>City view</h1>
      <p class="serif">Shortages across the city, counted, never named.</p></section>
    ${c.emptyText ? `<p class="empty glass">${esc(c.emptyText)}</p>` : ''}
    <section class="rows" aria-label="Medicines">${c.rows.map(r => `<div class="row glass"><div><b>${esc(r.drug)}</b><p class="muted" style="margin:2px 0 0">${esc(r.text)}</p></div>${statusChip(r.dosesShort > 0 ? 'red' : 'green', r.dosesShort > 0 ? `${r.hospitalsShort} short` : 'Covered')}</div>`).join('')}</section>`);
}

// ================================================================= ADMIN
async function viewAdmin() {
  document.title = 'Admin · MediLink';
  let hi, m;
  try { [hi, m] = await Promise.all([api('GET', '/health/integrations'), api('GET', '/admin/metrics')]); if (!lastHome) lastHome = await api('GET', '/me/home'); } catch (err) { return viewError(err, '#/admin'); }
  const S = { connected: ['green', 'Connected'], fallback: ['amber', 'Fallback'], misconfigured: ['red', 'Needs attention'] };
  appShell('#/admin', `
    <section class="hello"><p class="eyebrow">Administrator</p><h1>System status</h1><p class="serif">${esc(hi.summary)}</p></section>
    <section aria-labelledby="m-h"><div class="section-h"><h2 id="m-h">Success metrics</h2><span class="note">Demo data</span></div>
      <div class="mgrid">${m.metrics.map(x => `<div class="metric glass">${statusChip(x.met === null ? 'grey' : x.met ? 'green' : 'red', x.met === null ? 'No data yet' : x.met ? 'On target' : 'Off target')}<b style="color:var(--ink);font-weight:500">${esc(x.label)}</b><span class="v">${x.value === null ? '–' : esc(x.value)}<small style="font:12px var(--f-mono);color:var(--body)"> ${esc(x.unit)}</small></span><span class="muted">${esc(x.text)} Target: ${esc(x.target)}.</span></div>`).join('')}</div></section>
    <section aria-labelledby="i-h"><div class="section-h"><h2 id="i-h">SAP services</h2></div>
      <div class="rows">${hi.items.map(i => `<div class="row glass"><div><b>${esc(i.service)}</b><p class="muted" style="margin:2px 0 0">${esc(i.text)}</p></div>${statusChip(...S[i.status])}</div>`).join('')}</div></section>`);
}

// ---------------------------------------------------------------- start
if (location.protocol === 'file:') {
  document.getElementById('view').innerHTML = '<div class="stage"><section class="card glass" style="border-radius:24px"><h1 style="font-size:22px">Open MediLink through its server</h1><p>Run <b>npm run dev</b>, then open <b>http://localhost:4004/app.html</b>.</p></section></div>';
} else {
  if (!location.hash) location.hash = '#/login';
  route();
}
</script>
</body>
</html>
